name: Pruebas Avanzadas, Tiempos y TPS (ModaEstilo_Final y BI_Demo)

on: [push]

jobs:
  probar-rendimiento:
    runs-on: ubuntu-latest
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "PasswordFuerte123"
        ports:
          - 1433:1433

    steps:
      - name: Descargar tu código
        uses: actions/checkout@v4

      - name: Instalar herramientas de SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev

      - name: Ejecutar scripts y medir TPS en ambas bases de datos
        run: |
          echo "=== VERIFICANDO ARCHIVOS EN LA CARPETA DATABASE ==="
          ls -la ./database/
          
          echo "=== 1. EJECUTANDO ARCHIVOS Y MIDIENDO TIEMPOS INDIVIDUALES ==="
          for archivo in ./database/*.sql; do
            if [ -f "$archivo" ]; then
              echo "--------------------------------------------------"
              echo "Procesando archivo: $archivo"
              echo "--------------------------------------------------"
              
              INICIO_ARCHIVO=$(date +%s%N)
              /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -i "$archivo"
              FIN_ARCHIVO=$(date +%s%N)
              
              DURACION_ARCHIVO=$(echo "scale=3; ($FIN_ARCHIVO - $INICIO_ARCHIVO)/1000000000" | bc)
              echo ">>> Tiempo de ejecución individual para $archivo: $DURACION_ARCHIVO segundos <<<"
              echo ""
            fi
          done
          
          NUM_TRANSACCIONES=100

          echo "=================================================="
          echo "=== 2. PRUEBAS DE TPS EN BD: ModaEstilo_BI_Demo ==="
          echo "=================================================="
          
          # Venta
          INICIO_TPS1=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_BI_Demo" -Q "SELECT COUNT(*) FROM dbo.Venta;" > /dev/null
          done
          FIN_TPS1=$(date +%s%N)
          DURACION_TPS1=$(echo "scale=3; ($FIN_TPS1 - $INICIO_TPS1)/1000000000" | bc)
          TPS1=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS1" | bc)
          echo ">>> [BI_Demo] Venta: $TPS1 TPS ($DURACION_TPS1 s) <<<"

          # Cliente
          INICIO_TPS2=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_BI_Demo" -Q "SELECT COUNT(*) FROM dbo.Cliente;" > /dev/null
          done
          FIN_TPS2=$(date +%s%N)
          DURACION_TPS2=$(echo "scale=3; ($FIN_TPS2 - $INICIO_TPS2)/1000000000" | bc)
          TPS2=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS2" | bc)
          echo ">>> [BI_Demo] Cliente: $TPS2 TPS ($DURACION_TPS2 s) <<<"

          # Articulo
          INICIO_TPS3=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_BI_Demo" -Q "SELECT COUNT(*) FROM dbo.Articulo;" > /dev/null
          done
          FIN_TPS3=$(date +%s%N)
          DURACION_TPS3=$(echo "scale=3; ($FIN_TPS3 - $INICIO_TPS3)/1000000000" | bc)
          TPS3=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS3" | bc)
          echo ">>> [BI_Demo] Producto: $TPS3 TPS ($DURACION_TPS3 s) <<<"
          echo ""

          echo "=================================================="
          echo "=== 3. PRUEBAS DE TPS EN BD: ModaEstilo_Final  ==="
          echo "=================================================="
          
          # Venta
          INICIO_TPS4=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_Final" -Q "SELECT COUNT(*) FROM dbo.Venta;" > /dev/null
          done
          FIN_TPS4=$(date +%s%N)
          DURACION_TPS4=$(echo "scale=3; ($FIN_TPS4 - $INICIO_TPS4)/1000000000" | bc)
          TPS4=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS4" | bc)
          echo ">>> [Final] Venta: $TPS4 TPS ($DURACION_TPS4 s) <<<"

          # Cliente
          INICIO_TPS5=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_Final" -Q "SELECT COUNT(*) FROM dbo.Cliente;" > /dev/null
          done
          FIN_TPS5=$(date +%s%N)
          DURACION_TPS5=$(echo "scale=3; ($FIN_TPS5 - $INICIO_TPS5)/1000000000" | bc)
          TPS5=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS5" | bc)
          echo ">>> [Final] Cliente: $TPS5 TPS ($DURACION_TPS5 s) <<<"

          # Articulo
          INICIO_TPS6=$(date +%s%N)
          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -d "ModaEstilo_Final" -Q "SELECT COUNT(*) FROM dbo.Articulo;" > /dev/null
          done
          FIN_TPS6=$(date +%s%N)
          DURACION_TPS6=$(echo "scale=3; ($FIN_TPS6 - $INICIO_TPS6)/1000000000" | bc)
          TPS6=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS6" | bc)
          echo ">>> [Final] Producto: $TPS6 TPS ($DURACION_TPS6 s) <<<"
