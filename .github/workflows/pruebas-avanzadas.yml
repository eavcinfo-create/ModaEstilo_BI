name: Pruebas Avanzadas y TPS con Filtros

on: [push]

jobs:
  probar-rendimiento:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "PasswordFuerte123"
        ports:
          - 1433:1433

    steps:
      - name: Descargar tu código
        uses: actions/checkout@v4

      - name: Instalar herramientas de SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev

      - name: Cargar archivos y medir TPS con consulta filtrada
        run: |
          echo "=== 1. EJECUTANDO ARCHIVOS DE LA BASE DE DATOS ==="
          for archivo in ./database/*.sql; do
            if [ -f "$archivo" ]; then
              echo "Ejecutando: $archivo"
              /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -Q "SET STATISTICS TIME ON;" -i "$archivo"
            fi
          done

          echo "=== 2. MIDIENDO TRANSACCIONES POR SEGUNDO (TPS) CON CONSULTA AVANZADA ==="
          NUM_TRANSACCIONES=100
          INICIO=$(date +%s%N)

          for i in $(seq 1 $NUM_TRANSACCIONES); do
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -Q "SELECT COUNT(*) FROM dbo.Venta WHERE Total > 0;" > /dev/null
          done

          FIN=$(date +%s%N)
          DURACION=$(echo "scale=3; ($FIN - $INICIO)/1000000000" | bc)
          TPS=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION" | bc)

          echo "Total de transacciones ejecutadas: $NUM_TRANSACCIONES"
          echo "Tiempo total: $DURACION segundos"
          echo ">>> RENDIMIENTO CALCULADO (AVANZADO): $TPS Transacciones por Segundo (TPS) <<<"
