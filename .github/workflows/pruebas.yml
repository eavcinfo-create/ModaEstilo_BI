name: Pruebas de Base de Datos y TPS por Archivo

on: [push]

jobs:
  probar-rendimiento:
    runs-on: ubuntu-latest
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "PasswordFuerte123"
        ports:
          - 1433:1433

    steps:
      - name: Descargar tu código
        uses: actions/checkout@v4

      - name: Instalar herramientas de SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev

      - name: Medir tiempos individuales y TPS por cada archivo .sql
        run: |
          echo "=== VERIFICANDO ARCHIVOS EN LA CARPETA DATABASE ==="
          ls -la ./database/
          
          echo "=== INICIANDO PRUEBAS DE RENDIMIENTO INDIVIDUALES ==="
          
          for archivo in ./database/*.sql; do
            if [ -f "$archivo" ]; then
              echo "--------------------------------------------------"
              echo "Procesando archivo: $archivo"
              echo "--------------------------------------------------"
              
              # 1. Medir el tiempo exacto que tarda este archivo en ejecutarse
              INICIO_ARCHIVO=$(date +%s%N)
              /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -i "$archivo"
              FIN_ARCHIVO=$(date +%s%N)
              
              DURACION_ARCHIVO=$(echo "scale=3; ($FIN_ARCHIVO - $INICIO_ARCHIVO)/1000000000" | bc)
              echo "Tiempo transcurrido para $archivo: $DURACION_ARCHIVO segundos"
              
              # 2. Calcular las TPS específicas para este archivo realizando 100 consultas de prueba
              echo "Calculando TPS para este escenario..."
              NUM_TRANSACCIONES=100
              INICIO_TPS=$(date +%s%N)
              
              for i in $(seq 1 $NUM_TRANSACCIONES); do
                /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "PasswordFuerte123" -Q "SELECT COUNT(*) FROM dbo.Venta;" > /dev/null
              done
              
              FIN_TPS=$(date +%s%N)
              DURACION_TPS=$(echo "scale=3; ($FIN_TPS - $INICIO_TPS)/1000000000" | bc)
              TPS=$(echo "scale=2; $NUM_TRANSACCIONES / $DURACION_TPS" | bc)
              
              echo ">>> RESULTADO PARA $archivo: $TPS Transacciones por Segundo (TPS) ($DURACION_TPS s) <<<"
              echo ""
            fi
          done
          
          echo "=== TODAS LAS PRUEBAS FINALES CON ÉXITO ==="
